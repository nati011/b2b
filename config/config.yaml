# Application Configuration
# All fields are required unless marked as optional

app:
  name: "nucleus"
  version: "1.0.0-Snapshot"
  env: "development"  # Options: development, staging, production

server:
  host: "localhost"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

logging:
  # Options: debug, info, warn, error
  level: "info"
  # Options: json, text
  format: "json"
  # Include source file and line number in logs (can be expensive in production)
  source_location: false
  # Sampling rate: 1.0 = log all, 0.5 = log 50%, 0.1 = log 10% (for high-volume endpoints)
  sampling_rate: 1.0
  # Use async buffered logging for high-throughput scenarios
  async: false
  # Enable sensitive data sanitization (redacts passwords, tokens, emails, credit cards, SSNs)
  sanitize: false

db:
  driver: postgres  # Options: postgres, mysql, sqlite
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  database: core
  # Optional: postgres-specific SSL mode (e.g., disable, require, verify-full)
  sslmode: disable

auth:
  # Options: basic, oauth2
  mode: basic
  basic:
    realm: "b2b Admin"
    # Default values for superadmin user creation
    # Email is constructed as: user_prefix + username + email_domain
    # Example: "admin-" + "admin" + "@admin.local" = "admin-admin@admin.local"
    email_domain: "@admin.local"
    user_prefix: "admin-"
    user_name: "Admin"
    # Admin users are automatically created during application bootstrap
    # Users defined here will be automatically assigned the "Admin" role
    # Role name: "Admin" (from config/roles.yaml)
    users:
      - username: "admin"
        password: "changeme"
        # This user will be created with:
        # - Email: admin-admin@admin.local
        # - Role: Admin (automatically assigned)
        # - User Type: officer
        # - Status: active
  
  # Optional: OAuth2 configuration (only required when mode: oauth2)
  # oauth2:
  #   client_id: "my-client"
  #   client_secret: "my-secret"
  #   authorize_url: "https://provider.com/oauth/authorize"
  #   token_url: "https://provider.com/oauth/token"
  #   redirect_url: "https://myapp/callback"
  #   scopes:
  #     - "email"
  #     - "profile"

resources:
  # Path to the resources.yaml manifest file
  # If not specified, defaults to "config/resources.yaml"
  path: "config/resources.yaml"

roles:
  # Path to the roles.yaml file containing default role definitions
  # If not specified, defaults to "config/roles.yaml"
  path: "config/roles.yaml"