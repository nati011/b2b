services:
  db:
    image: postgres:16-alpine
    container_name: b2b-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-b2b}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - b2b-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-migrations
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-b2b}
    entrypoint: []
    command:
      - sh
      - -c
      - |
        echo "Waiting for database..."
        until PGPASSWORD=$$DB_PASSWORD psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d postgres -c '\q' 2>/dev/null; do
          echo "Database unavailable - sleeping"
          sleep 2
        done
        echo "Creating database if not exists..."
        PGPASSWORD=$$DB_PASSWORD psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d postgres -c "SELECT 1 FROM pg_database WHERE datname = '$$DB_NAME'" | grep -q 1 || \
          PGPASSWORD=$$DB_PASSWORD psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d postgres -c "CREATE DATABASE $$DB_NAME;"
        echo "Running migrations..."
        migrate -path /root/db/migrations -database "postgres://$$DB_USER:$$DB_PASSWORD@$$DB_HOST:$$DB_PORT/$$DB_NAME?sslmode=disable" up
        echo "Migrations done."
    depends_on:
      db:
        condition: service_healthy
    networks:
      - b2b-net
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-seed
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-b2b}
    entrypoint: []
    command:
      - sh
      - -c
      - |
        export DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME
        bash /root/db/seed/seed_all.sh
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - b2b-net
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-b2b}
    entrypoint: ["/bin/sh", "-c", "envsubst < /root/config/config.docker.compose.yaml.tpl > /tmp/config.yaml && exec ./marketplace -config /tmp/config.yaml"]
    volumes:
      - ./config/config.docker.compose.yaml.tpl:/root/config/config.docker.compose.yaml.tpl:ro
    ports:
      - "0.0.0.0:8090:8090"
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      - b2b-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8090 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: b2b-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      SCRIPT_NAME: /pgadmin
    ports:
      - "0.0.0.0:5051:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - b2b-net
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  nginx:
    image: nginx:alpine
    container_name: b2b-nginx
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - b2b-net
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  b2b-net:
    driver: bridge
