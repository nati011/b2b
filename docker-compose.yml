services:
  db:
    image: postgres:16-alpine
    container_name: b2b-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: b2b
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - b2b-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d b2b"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-migrations
    entrypoint: []
    command:
      - sh
      - -c
      - |
        echo "Waiting for database..."
        until PGPASSWORD=postgres psql -h db -p 5432 -U postgres -d postgres -c '\q' 2>/dev/null; do
          echo "Database unavailable - sleeping"
          sleep 2
        done
        echo "Creating database if not exists..."
        PGPASSWORD=postgres psql -h db -p 5432 -U postgres -d postgres -c "SELECT 1 FROM pg_database WHERE datname = 'b2b'" | grep -q 1 || \
          PGPASSWORD=postgres psql -h db -p 5432 -U postgres -d postgres -c "CREATE DATABASE b2b;"
        echo "Running migrations..."
        migrate -path /root/db/migrations -database "postgres://postgres:postgres@db:5432/b2b?sslmode=disable" up
        echo "Migrations done."
    depends_on:
      db:
        condition: service_healthy
    networks:
      - b2b-net
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-seed
    entrypoint: []
    command:
      - sh
      - -c
      - |
        export DB_HOST=db DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres DB_NAME=b2b
        bash /root/db/seed/seed_all.sh
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - b2b-net
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-backend
    entrypoint: []
    command: ["./marketplace", "-config", "config/config.docker.compose.yaml"]
    volumes:
      - ./config/config.docker.compose.yaml:/root/config/config.docker.compose.yaml:ro
    ports:
      - "8090:8090"
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      - b2b-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8090 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: b2b-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5051:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - b2b-net
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  nginx:
    image: nginx:alpine
    container_name: b2b-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - b2b-net
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  b2b-net:
    driver: bridge
