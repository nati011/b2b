# Host nginx config for api.efoyetastore.com
# Copy to /etc/nginx/sites-available/ and enable:
#   sudo cp nginx/host-api.efoyetastore.com.conf /etc/nginx/sites-available/api.efoyetastore.com
#   sudo ln -sf /etc/nginx/sites-available/api.efoyetastore.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisite: Docker backend listening on 127.0.0.1:8090 (docker compose -p ... ports 8090:8090)
# SSL certs: use your existing cert path or Let's Encrypt /etc/letsencrypt/live/api.efoyetastore.com/

server {
    listen 80;
    server_name api.efoyetastore.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.efoyetastore.com;

    ssl_certificate     /etc/letsencrypt/live/api.efoyetastore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.efoyetastore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Accept-Language, Origin, X-User-ID, Cache-Control, Pragma" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
