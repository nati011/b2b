name: Docker CI/CD
on:
  push:
    branches: [ "development", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.image-name }}
      container-name: ${{ steps.set-tag.outputs.container-name }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Set image tag and container name
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/my-app:dev" >> $GITHUB_OUTPUT
            echo "container-name=my-app-dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/my-app:latest" >> $GITHUB_OUTPUT
            echo "container-name=my-app-prod" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ steps.set-tag.outputs.image-name }}"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
  
  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and deploy Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            # Set variables based on branch
            ENV_VARS="-e PORT=${{ secrets.DEV_PORT || '8080' }} \
                        -e KEYCLOAK_BASE_URL='${{ secrets.DEV_KEYCLOAK_BASE_URL }}' \
                        -e KEYCLOAK_USER_NAME='${{ secrets.DEV_KEYCLOAK_USER_NAME }}' \
                        -e KEYCLOAK_PASSWORD='${{ secrets.DEV_KEYCLOAK_PASSWORD }}' \
                        -e KEYCLOAK_REALM='${{ secrets.DEV_KEYCLOAK_REALM }}' \
                        -e KEYCLOAK_CLIENT_ID='${{ secrets.DEV_KEYCLOAK_CLIENT_ID }}' \
                        -e KEYCLOAK_APPLICATION_REALM='${{ secrets.DEV_KEYCLOAK_APPLICATION_REALM }}' \
                        -e DB_URL='${{ secrets.DEV_DB_URL }}' \
                        -e SMTP='${{ secrets.DEV_SMTP }}' \
                        -e EMAIL='${{ secrets.DEV_EMAIL }}' \
                        -e DEFAULT_SUPERADMIN_EMAIL='${{ secrets.DEV_DEFAULT_SUPERADMIN_EMAIL }}' \
                        -e KEYCLOAK_CLIENT_SECRET='${{ secrets.DEV_KEYCLOAK_CLIENT_SECRET }}' \
                        -e ENV=development \
                        -e BASE_URL='${{ secrets.DEV_BASE_URL }}' \
                        -e FRONTEND_URL='${{ secrets.DEV_FRONTEND_URL }}' \
                        -e CLIENT_VERSION='${{ secrets.DEV_CLIENT_VERSION }}' \
                        -e JWT_SECRET='${{ secrets.DEV_JWT_SECRET }}' \
                        -e EMAIL_PASSWORD='${{ secrets.DEV_EMAIL_PASSWORD }}'"
            if [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
              echo "🚀 Deploying to DEVELOPMENT environment"
              CONTAINER_NAME="my-app-dev"
              TAG="dev"
              PORT_MAPPING="8089:8080"
              # Development environment variables
            elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "🚀 Deploying to PRODUCTION environment"
              CONTAINER_NAME="my-app-prod"
              TAG="latest"
              PORT_MAPPING="8088:8080"
              # Production environment variables
              ENV_VARS="-e PORT=${{ secrets.PROD_PORT || '8080' }} \
                        -e KEYCLOAK_BASE_URL='${{ secrets.PROD_KEYCLOAK_BASE_URL }}' \
                        -e KEYCLOAK_USER_NAME='${{ secrets.PROD_KEYCLOAK_USER_NAME }}' \
                        -e KEYCLOAK_PASSWORD='${{ secrets.PROD_KEYCLOAK_PASSWORD }}' \
                        -e KEYCLOAK_REALM='${{ secrets.PROD_KEYCLOAK_REALM }}' \
                        -e KEYCLOAK_CLIENT_ID='${{ secrets.PROD_KEYCLOAK_CLIENT_ID }}' \
                        -e KEYCLOAK_APPLICATION_REALM='${{ secrets.PROD_KEYCLOAK_APPLICATION_REALM }}' \
                        -e DB_URL='${{ secrets.PROD_DB_URL }}' \
                        -e SMTP='${{ secrets.PROD_SMTP }}' \
                        -e EMAIL='${{ secrets.PROD_EMAIL }}' \
                        -e DEFAULT_SUPERADMIN_EMAIL='${{ secrets.PROD_DEFAULT_SUPERADMIN_EMAIL }}' \
                        -e KEYCLOAK_CLIENT_SECRET='${{ secrets.PROD_KEYCLOAK_CLIENT_SECRET }}' \
                        -e ENV=production \
                        -e BASE_URL='${{ secrets.PROD_BASE_URL }}' \
                        -e FRONTEND_URL='${{ secrets.PROD_FRONTEND_URL }}' \
                        -e CLIENT_VERSION='${{ secrets.PROD_CLIENT_VERSION }}' \
                        -e JWT_SECRET='${{ secrets.PROD_JWT_SECRET }}' \
                        -e EMAIL_PASSWORD='${{ secrets.PROD_EMAIL_PASSWORD }}'"
            else
              echo "❌ Unknown branch: ${{ github.ref }}"
              echo "This workflow only supports 'main' and 'development' branches"
              exit 1
            fi
            
            IMAGE_NAME="${{ secrets.DOCKER_HUB_USERNAME }}/my-app:$TAG"
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            
            # Pull latest image
            docker pull "$IMAGE_NAME"
            
            # Stop and remove existing container if it exists
            if [ $(docker ps -aq -f name=$CONTAINER_NAME) ]; then
              echo "Stopping existing container: $CONTAINER_NAME"
              docker stop $CONTAINER_NAME
              docker rm $CONTAINER_NAME
            fi
            
            # Debug output
            echo "Image: $IMAGE_NAME"
            echo "Container: $CONTAINER_NAME"
            echo "Port mapping: $PORT_MAPPING"
            echo "Environment variables being set:"
            echo "$ENV_VARS" | tr ' ' '\n' | grep "^-e"
            
            # Show the exact command that will be executed
            echo -e "\n=== Full Docker Run Command ==="
            echo "docker run -d --name $CONTAINER_NAME -p $PORT_MAPPING $ENV_VARS \"$IMAGE_NAME\""
            
            # Show environment variables in a readable format
            echo -e "\n=== Environment Variables (Readable Format) ==="
            echo "$ENV_VARS" | tr ' ' '\n' | grep "^-e" | sed 's/^-e //' | sort
            
            # Run new container with port mapping
            echo "Starting new container: $CONTAINER_NAME"
            echo "Full docker run command will be:"
            echo "docker run -d --name $CONTAINER_NAME -p $PORT_MAPPING $ENV_VARS \"$IMAGE_NAME\""
            
            # Try to run the container and capture any errors
            if docker run -d --name $CONTAINER_NAME -p $PORT_MAPPING $ENV_VARS "$IMAGE_NAME"; then
              echo "Container started successfully"
              
              # Wait a moment for container to initialize
              sleep 3
              
              # Check if container is still running
              if docker ps | grep -q $CONTAINER_NAME; then
                echo "✅ Container is running successfully"
                docker ps | grep $CONTAINER_NAME
              else
                echo "❌ Container started but then stopped"
                docker ps -a | grep $CONTAINER_NAME
              fi
              
              # Show container logs
              echo "Container logs:"
              docker logs $CONTAINER_NAME --tail 20
              
              # Additional debugging if container is running
              if docker ps | grep -q $CONTAINER_NAME; then
                echo "Container environment check:"
                docker exec -t $CONTAINER_NAME env | grep -E "(PORT|ENV)" || true
                
                echo "Container processes:"
                docker exec -t $CONTAINER_NAME ps aux || true
              fi
              
            else
              echo "❌ Failed to start container"
              echo "Docker run command that failed:"
              echo "docker run -d --name $CONTAINER_NAME -p $PORT_MAPPING $ENV_VARS \"$IMAGE_NAME\""
              
              echo "Checking for any containers with same name:"
              docker ps -a | grep $CONTAINER_NAME || echo "No containers found with that name"
              
              echo "Checking if image exists:"
              docker images | grep my-app || echo "Image not found"
              
              echo "Checking port conflicts:"
              sudo netstat -tulpn | grep 8088 || echo "Port 8088 is free"
              
              echo "Docker daemon status:"
              docker info | grep -E "(Server Version|Storage Driver)" || true
              
              echo "Available disk space:"
              df -h || true
              
              echo "Recent Docker events:"
              docker events --since 5m --until now 2>/dev/null | tail -5 || echo "No recent events"
            fi
            
            # Final status check
            echo "=== FINAL STATUS ==="
            echo "All containers:"
            docker ps -a
            echo "Running containers only:"
            docker ps
