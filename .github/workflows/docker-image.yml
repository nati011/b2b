name: Docker CI/CD
on:
  push:
    branches: [ "development", "main" ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.image-name }}
    steps:
      - uses: actions/checkout@v4
      # Log in to Docker Hub on GitHub Actions runner
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Verify Docker login
        run: docker info
      # Determine tag based on branch
      - name: Set image tag
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/my-app:dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/my-app:latest" >> $GITHUB_OUTPUT
          fi
      # Build and push the Docker image
      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ steps.set-tag.outputs.image-name }}"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
  
  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # SSH into the remote server and deploy the container
      - name: SSH and deploy Docker container
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            # Set variables based on branch
            if [[ "${{ github.ref }}" == "refs/heads/development" ]]; then
              ENV_FILE=.env.development
              TAG=dev
            elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              ENV_FILE=.env.production
              TAG=latest
            fi
            
            IMAGE_NAME="${{ secrets.DOCKER_HUB_USERNAME }}/my-app:$TAG"
            
            # Log in to Docker Hub on the server using stdin (more secure)
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            
            # Pull latest image
            docker pull "$IMAGE_NAME"
            
            # Stop and remove existing container if it exists
            if [ $(docker ps -aq -f name=my-app) ]; then
              docker stop my-app
              docker rm my-app
            fi
            
            # Run new container with proper name
            docker run -d --name my-app --env-file "$ENV_FILE" -p 8088:8088 "$IMAGE_NAME"
