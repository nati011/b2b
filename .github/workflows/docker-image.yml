name: Docker CI/CD

on:
  push:
    branches: [ "development", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Verify Docker login
        run: docker info

      - name: Set image tag
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        run: |
          docker build -t myusername/my-app:${{ steps.set-tag.outputs.tag }} .
          docker push myusername/my-app:${{ steps.set-tag.outputs.tag }}

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and deploy Docker container
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            if [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
              ENV_FILE=.env.development
              TAG=dev
            elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              ENV_FILE=.env.production
              TAG=latest
            fi

            # Pull the latest Docker image from Docker Hub
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
            docker pull myusername/my-app:$TAG

            # Stop and remove any existing container
            docker rm -f my-app || true

            # Run the container
            docker run -d --env-file $ENV_FILE --name my-app -p 8088:8088 myusername/my-app:$TAG
