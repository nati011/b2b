name: Docker CI/CD

on:
  push:
    branches: [ "development", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.image-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Verify Docker login
        run: docker info

      - name: Set image tag
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/b2b:dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/b2b:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ steps.set-tag.outputs.image-name }}"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and deploy Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail

            case "${{ github.ref }}" in
              refs/heads/development)
                echo "Deploying to DEVELOPMENT"
                CONTAINER_NAME="b2b-dev"
                TAG="dev"
                PORT="${{ secrets.DEV_PORT }}"
                DB_HOST="${{ secrets.DEV_DB_HOST }}"
                DB_PORT="${{ secrets.DEV_DB_PORT }}"
                DB_USER="${{ secrets.DEV_DB_USER }}"
                DB_PASSWORD="${{ secrets.DEV_DB_PASSWORD }}"
                DB_NAME="${{ secrets.DEV_DB_NAME }}"
                DB_SSLMODE="${{ secrets.DEV_DB_SSLMODE }}"
                ;;
              refs/heads/main)
                echo "Deploying to PRODUCTION"
                CONTAINER_NAME="b2b"
                TAG="latest"
                PORT="${{ secrets.PROD_PORT }}"
                DB_HOST="${{ secrets.PROD_DB_HOST }}"
                DB_PORT="${{ secrets.PROD_DB_PORT }}"
                DB_USER="${{ secrets.PROD_DB_USER }}"
                DB_PASSWORD="${{ secrets.PROD_DB_PASSWORD }}"
                DB_NAME="${{ secrets.PROD_DB_NAME }}"
                DB_SSLMODE="${{ secrets.PROD_DB_SSLMODE }}"
                ;;
              *)
                echo "Unknown branch: ${{ github.ref }}"
                exit 1
                ;;
            esac

            IMAGE_NAME="${{ secrets.DOCKER_HUB_USERNAME }}/b2b:$TAG"
            CONTAINER_PORT="8090"

            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            echo "Pulling image $IMAGE_NAME..."
            docker pull "$IMAGE_NAME"

            if docker ps -aq -f "name=^${CONTAINER_NAME}$" | grep -q .; then
              echo "Stopping and removing old container..."
              docker stop "$CONTAINER_NAME" && docker rm "$CONTAINER_NAME"
            fi

            echo "Starting new container..."
            docker run -d \
              -p "${PORT}:${CONTAINER_PORT}" \
              --name "$CONTAINER_NAME" \
              -e DB_HOST="$DB_HOST" \
              -e DB_PORT="$DB_PORT" \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e DB_NAME="$DB_NAME" \
              -e DB_SSLMODE="$DB_SSLMODE" \
              "$IMAGE_NAME"

            sleep 5
            if docker ps --filter "name=^${CONTAINER_NAME}$" --format "{{.Names}}" | grep -q "^${CONTAINER_NAME}$"; then
              echo "Container started successfully"
              docker logs "$CONTAINER_NAME" --tail 20
            else
              echo "Failed to start container"
              docker ps -a --filter "name=^${CONTAINER_NAME}$"
              exit 1
            fi
