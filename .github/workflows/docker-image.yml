name: Docker CI/CD

on:
  push:
    branches: [ "development", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.image-name }}
    steps:
      - uses: actions/checkout@v4

      # Log in to Docker Hub on GitHub Actions runner
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Verify Docker login
        run: docker info

      # Determine tag based on branch
      - name: Set image tag
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/my-app:dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/my-app:latest" >> $GITHUB_OUTPUT
          fi

      # Build and push the Docker image
      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ steps.set-tag.outputs.image-name }}"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and deploy Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            #!/bin/bash
            set -euo pipefail

            # Determine environment from branch
            case "${{ github.ref }}" in
              refs/heads/development)
                echo "🚀 Deploying to DEVELOPMENT environment"
                CONTAINER_NAME="my-app"
                TAG="dev"
                ENVIRONMENT="development"
                ;;
              refs/heads/main)
                echo "🚀 Deploying to PRODUCTION environment"
                CONTAINER_NAME="my-app-prod"
                TAG="latest"
                PORT_MAPPING="8088:8080"
                ENVIRONMENT="production"
                ;;
              *)
                echo "❌ Unknown branch: ${{ github.ref }}"
                exit 1
                ;;
            esac

            IMAGE_NAME="${{ secrets.DOCKER_HUB_USERNAME }}/my-app:$TAG"

            # Login to Docker Hub
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            # Pull latest image
            docker pull "$IMAGE_NAME"

            # Stop & remove old container if it exists (exact match)
            if docker ps -aq -f "name=^${CONTAINER_NAME}$" >/dev/null; then
              docker stop "$CONTAINER_NAME" && docker rm "$CONTAINER_NAME"
            fi

            # Run new container with env vars
            docker run -d \
              --name "$CONTAINER_NAME" \
              -p "$PORT_MAPPING" \
              --env PORT=${{ secrets.DEV_PORT }} \
              --env KEYCLOAK_BASE_URL=${{ secrets.DEV_KEYCLOAK_BASE_URL }} \
              --env KEYCLOAK_USER_NAME=${{ secrets.DEV_KEYCLOAK_USER_NAME }} \
              --env KEYCLOAK_PASSWORD=${{ secrets.DEV_KEYCLOAK_PASSWORD }} \
              --env KEYCLOAK_REALM=${{ secrets.DEV_KEYCLOAK_REALM }} \
              --env KEYCLOAK_CLIENT_ID=${{ secrets.DEV_KEYCLOAK_CLIENT_ID }} \
              --env KEYCLOAK_APPLICATION_REALM=${{ secrets.DEV_KEYCLOAK_APPLICATION_REALM }} \
              --env DB_URL=${{ secrets.DEV_DB_URL }} \
              --env SMTP=${{ secrets.DEV_SMTP }} \
              --env EMAIL=${{ secrets.DEV_EMAIL }} \
              --env DEFAULT_SUPERADMIN_EMAIL=${{ secrets.DEV_DEFAULT_SUPERADMIN_EMAIL }} \
              --env KEYCLOAK_CLIENT_SECRET=${{ secrets.DEV_KEYCLOAK_CLIENT_SECRET }} \
              --env ENV=$ENVIRONMENT \
              --env BASE_URL=${{ secrets.DEV_BASE_URL }} \
              --env FRONTEND_URL=${{ secrets.DEV_FRONTEND_URL }} \
              --env CLIENT_VERSION=${{ secrets.DEV_CLIENT_VERSION }} \
              --env JWT_SECRET=${{ secrets.DEV_JWT_SECRET }} \
              --env EMAIL_PASSWORD=${{ secrets.DEV_EMAIL_PASSWORD }} \
              "$IMAGE_NAME"

            # Check if container started
            sleep 5
            if docker ps --filter "name=^${CONTAINER_NAME}$" --format "{{.Names}}" | grep -q "^${CONTAINER_NAME}$"; then
              echo "✅ Container started successfully"
              docker logs "$CONTAINER_NAME" --tail 20
            else
              echo "❌ Failed to start container"
              docker ps -a --filter "name=^${CONTAINER_NAME}$"
              exit 1
            fi
