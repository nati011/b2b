name: Docker CI/CD

on:
  push:
    branches: [ "development", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.image-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Verify Docker login
        run: docker info

      - name: Set image tag
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/my-app:dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "image-name=${{ secrets.DOCKER_HUB_USERNAME }}/my-app:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ steps.set-tag.outputs.image-name }}"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and deploy Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            #!/bin/bash
            set -euo pipefail

            echo "Determining environment from branch..."
            case "${{ github.ref }}" in
              refs/heads/development)
                echo "🚀 Deploying to DEVELOPMENT environment"
                CONTAINER_NAME="my-app-dev"
                TAG="dev"
                ENVIRONMENT="development"

                PORT="${{ secrets.DEV_PORT }}"
                BASE_URL="${{ secrets.DEV_BASE_URL }}"
                FRONTEND_URL="${{ secrets.DEV_FRONTEND_URL }}"
                KEYCLOAK_BASE_URL="${{ secrets.DEV_KEYCLOAK_BASE_URL }}"
                KEYCLOAK_USER_NAME="${{ secrets.DEV_KEYCLOAK_USER_NAME }}"
                KEYCLOAK_PASSWORD="${{ secrets.DEV_KEYCLOAK_PASSWORD }}"
                KEYCLOAK_REALM="${{ secrets.DEV_KEYCLOAK_REALM }}"
                KEYCLOAK_CLIENT_ID="${{ secrets.DEV_KEYCLOAK_CLIENT_ID }}"
                KEYCLOAK_APPLICATION_REALM="${{ secrets.DEV_KEYCLOAK_APPLICATION_REALM }}"
                KEYCLOAK_CLIENT_SECRET="${{ secrets.DEV_KEYCLOAK_CLIENT_SECRET }}"
                DB_URL="${{ secrets.DEV_DB_URL }}"
                SMTP="${{ secrets.DEV_SMTP }}"
                EMAIL="${{ secrets.DEV_EMAIL }}"
                DEFAULT_SUPERADMIN_EMAIL="${{ secrets.DEV_DEFAULT_SUPERADMIN_EMAIL }}"
                CLIENT_VERSION="${{ secrets.DEV_CLIENT_VERSION }}"
                JWT_SECRET="${{ secrets.DEV_JWT_SECRET }}"
                EMAIL_PASSWORD="${{ secrets.DEV_EMAIL_PASSWORD }}"
                ;;
              refs/heads/main)
                echo "🚀 Deploying to PRODUCTION environment"
                CONTAINER_NAME="my-app"
                TAG="latest"
                ENVIRONMENT="production"

                PORT="${{ secrets.PROD_PORT }}"
                BASE_URL="${{ secrets.PROD_BASE_URL }}"
                FRONTEND_URL="${{ secrets.PROD_FRONTEND_URL }}"
                KEYCLOAK_BASE_URL="${{ secrets.PROD_KEYCLOAK_BASE_URL }}"
                KEYCLOAK_USER_NAME="${{ secrets.PROD_KEYCLOAK_USER_NAME }}"
                KEYCLOAK_PASSWORD="${{ secrets.PROD_KEYCLOAK_PASSWORD }}"
                KEYCLOAK_REALM="${{ secrets.PROD_KEYCLOAK_REALM }}"
                KEYCLOAK_CLIENT_ID="${{ secrets.PROD_KEYCLOAK_CLIENT_ID }}"
                KEYCLOAK_APPLICATION_REALM="${{ secrets.PROD_KEYCLOAK_APPLICATION_REALM }}"
                KEYCLOAK_CLIENT_SECRET="${{ secrets.PROD_KEYCLOAK_CLIENT_SECRET }}"
                DB_URL="${{ secrets.PROD_DB_URL }}"
                SMTP="${{ secrets.PROD_SMTP }}"
                EMAIL="${{ secrets.PROD_EMAIL }}"
                DEFAULT_SUPERADMIN_EMAIL="${{ secrets.PROD_DEFAULT_SUPERADMIN_EMAIL }}"
                CLIENT_VERSION="${{ secrets.PROD_CLIENT_VERSION }}"
                JWT_SECRET="${{ secrets.PROD_JWT_SECRET }}"
                EMAIL_PASSWORD="${{ secrets.PROD_EMAIL_PASSWORD }}"
                ;;
              *)
                echo "❌ Unknown branch: ${{ github.ref }}"
                exit 1
                ;;
            esac

            IMAGE_NAME="${{ secrets.DOCKER_HUB_USERNAME }}/my-app:$TAG"

            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            echo "Creating environment file..."
            cat <<EOF >/tmp/app.env
PORT=$PORT
BASE_URL=$BASE_URL
FRONTEND_URL=$FRONTEND_URL
KEYCLOAK_BASE_URL=$KEYCLOAK_BASE_URL
KEYCLOAK_USER_NAME=$KEYCLOAK_USER_NAME
KEYCLOAK_PASSWORD=$KEYCLOAK_PASSWORD
KEYCLOAK_REALM=$KEYCLOAK_REALM
KEYCLOAK_CLIENT_ID=$KEYCLOAK_CLIENT_ID
KEYCLOAK_APPLICATION_REALM=$KEYCLOAK_APPLICATION_REALM
KEYCLOAK_CLIENT_SECRET=$KEYCLOAK_CLIENT_SECRET
DB_URL=$DB_URL
SMTP=$SMTP
EMAIL=$EMAIL
DEFAULT_SUPERADMIN_EMAIL=$DEFAULT_SUPERADMIN_EMAIL
CLIENT_VERSION=$CLIENT_VERSION
JWT_SECRET=$JWT_SECRET
EMAIL_PASSWORD=$EMAIL_PASSWORD
ENV=$ENVIRONMENT
EOF

            echo "Pulling image $IMAGE_NAME..."
            docker pull "$IMAGE_NAME"

            # Stop & remove old container
            if docker ps -aq -f "name=^${CONTAINER_NAME}$" | grep -q .; then
              echo "Stopping and removing old container..."
              docker stop "$CONTAINER_NAME"
              docker rm "$CONTAINER_NAME"
            fi

            echo "Starting new container..."
            docker run -d --name "$CONTAINER_NAME" --env-file /tmp/app.env "$IMAGE_NAME"

            # Verify container started
            sleep 5
            if docker ps --filter "name=^${CONTAINER_NAME}$" --format "{{.Names}}" | grep -q "^${CONTAINER_NAME}$"; then
              echo "✅ Container started successfully"
              docker logs "$CONTAINER_NAME" --tail 20
            else
              echo "❌ Failed to start container"
              docker ps -a --filter "name=^${CONTAINER_NAME}$"
              exit 1
            fi
