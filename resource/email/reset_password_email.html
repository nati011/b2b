<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; color: #222; margin: 0; padding: 0; }
    .container { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 32px 24px; }
    h2 { color: #2d3748; }
    p { margin-bottom: 24px; }
    .btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 12px 28px; border-radius: 4px; font-weight: bold; font-size: 16px; }
    .footer { margin-top: 32px; font-size: 13px; color: #888; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Your Password</h2>
    <p>Hello, <strong>{{ .username }}</strong>,</p>
    <p>We received a request to reset your password. Click the button below to set a new password for your account.</p>
    <p style="text-align:center;">
      <a class="btn" href="https://efoyeta.com/reset-password/{token}">Reset Password</a>
    </p>
    <p>If you did not request a password reset, you can safely ignore this email.</p>
    <div class="footer">
      &copy; <span id="year"></span> Efoyeta. All rights reserved.
    </div>
  </div>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
